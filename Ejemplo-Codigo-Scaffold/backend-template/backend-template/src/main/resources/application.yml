server:
  port: 8080

spring:
  application:
    name: backend-template
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # nunca create/update: el esquema lo gobierna Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: backend-template

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
