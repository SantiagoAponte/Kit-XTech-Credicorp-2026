# Perfil nodocker: H2 en memoria en modo PostgreSQL; mismas migraciones y semillas.
spring:
  datasource:
    url: jdbc:h2:mem:kitdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/seed
